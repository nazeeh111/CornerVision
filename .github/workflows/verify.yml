name: Verify CornerVision

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verification:
        description: 'Smoke; one CPU candidate; or full original default mushroom localization'
        type: choice
        default: smoke
        options:
          - smoke
          - candidate
          - localization

permissions:
  contents: read

jobs:
  verify:
    # Standard hosted VM and finite timeouts bound resource use. These are
    # not an instantaneous RSS cap or proof of process-group cleanup.
    runs-on: macos-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'localization' && 75 || 15 }}
    env:
      CORNERVISION_VERIFICATION: ${{ inputs.verification || 'smoke' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify all 165 preserved source files before MATLAB
        run: python3 tests/check_source_manifest.py

      - name: Set up base MATLAB R2026a
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d
        with:
          release: R2026a

      - name: Run smoke and selected manual calculation
        # Full localization has a conservative finite cutoff, not an ETA.
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'localization' && 60 || 5 }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          startup-options: -singleCompThread
          generate-summary: false
          command: >-
            mode = getenv('CORNERVISION_VERIFICATION');
            assert(any(strcmp(mode, {'smoke', 'candidate', 'localization'})), 'Unknown verification mode');
            run('tests/smoke_test.m');
            if strcmp(mode, 'candidate'), addpath('tests'); localization_candidate; end
            if strcmp(mode, 'localization'), addpath('tests'); localization_full; end

      - name: Verify all 165 preserved source files after MATLAB
        if: always()
        run: python3 tests/check_source_manifest.py
